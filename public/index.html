<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Żużel — gra online</title>
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/css/mobile.css">
</head>
<body class="mobile-app">
  <div id="app">
    <header class="mobile-header">
      <h1>🏍️ Żużel</h1>
      <p class="subtitle">Color Chainz Stadium · max 4 graczy</p>
    </header>

    <!-- Ekran startowy -->
    <section id="screen-landing" class="mobile-screen panel">
      <button type="button" class="btn primary btn-block" id="btn-create-game">Stwórz grę</button>
      <div class="join-divider">lub dołącz</div>
      <label class="join-code-label">
        Kod pokoju
        <input type="text" id="join-code-input" class="join-code-input" maxlength="6" autocomplete="off" autocapitalize="characters" placeholder="np. A7K2M9">
      </label>
      <button type="button" class="btn btn-block" id="btn-join-game">Dołącz do gry</button>
      <p class="setup-hint mobile-footer-hint"><a href="/local.html">Graj lokalnie na PC</a> (klawiatura, 4 graczy)</p>
    </section>

    <!-- Profil gracza -->
    <section id="screen-profile" class="mobile-screen panel hidden">
      <h2 id="profile-title">Twój zawodnik</h2>
      <label>Nick <input type="text" id="profile-name" maxlength="16" placeholder="Twoje imię"></label>
      <label>Drużyna
        <select id="profile-team">
          <option value="A">Drużyna A</option>
          <option value="B">Drużyna B</option>
        </select>
      </label>
      <fieldset class="color-picker-field">
        <legend>Kolor</legend>
        <div id="color-options" class="color-options"></div>
      </fieldset>
      <button type="button" class="btn primary btn-block" id="btn-profile-confirm">Wejdź do pokoju</button>
      <button type="button" class="btn btn-block btn-ghost" id="btn-profile-back">Wróć</button>
    </section>

    <!-- Lobby -->
    <section id="screen-lobby" class="mobile-screen panel hidden">
      <div class="room-code-box">
        <span class="room-code-label">Kod pokoju</span>
        <div class="room-code-row">
          <strong id="lobby-code" class="room-code-value">------</strong>
          <button type="button" class="btn btn-small" id="btn-copy-code">Kopiuj</button>
        </div>
        <p class="setup-hint">Podaj kod znajomym — każdy dołącza ze swojego telefonu.</p>
      </div>
      <h3>Gracze <span id="lobby-count">0/4</span></h3>
      <ul id="lobby-players" class="lobby-players"></ul>
      <div id="lobby-host-actions" class="lobby-actions hidden">
        <button type="button" class="btn primary btn-block" id="btn-start-match">Start meczu</button>
      </div>
      <p id="lobby-wait" class="setup-hint">Czekaj na start meczu od hosta…</p>
    </section>

    <!-- Gra -->
    <section id="screen-game" class="mobile-screen hidden">
      <div class="game-canvas-wrap">
        <canvas id="track-canvas" width="1000" height="700"></canvas>
      </div>
      <div id="hud-mobile" class="hud-mobile">
        <div id="race-info-mobile"></div>
        <div id="my-status-mobile"></div>
        <div id="score-mobile"></div>
      </div>
      <div class="touch-controls">
        <button type="button" class="speed-btn" id="btn-speed" aria-label="Zmień limit prędkości">100%</button>
        <button type="button" class="turn-btn" id="btn-turn">SKRĘĆ</button>
      </div>
    </section>

    <div id="overlay" class="hidden">
      <div id="overlay-content"></div>
    </div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="/js/track-geometry.js?v=22"></script>
  <script src="/js/tracks-catalog.js?v=22"></script>
  <script src="/js/track-render.js?v=22"></script>
  <script src="/js/online-client.js?v=22"></script>
</body>
</html>
