# /etc/nginx/sites-available/zuzel-dev.hpkgrupa.pl
# Instalacja: deploy/dev-install.sh (nie dotyka playclub.pl ani zuzel produkcyjnego)
#
#   sudo cp deploy/nginx-zuzel-dev.hpkgrupa.pl.conf /etc/nginx/sites-available/zuzel-dev.hpkgrupa.pl
#   sudo ln -sf /etc/nginx/sites-available/zuzel-dev.hpkgrupa.pl /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d zuzel-dev.hpkgrupa.pl

server {
    listen 80;
    listen [::]:80;
    server_name zuzel-dev.hpkgrupa.pl;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
        try_files $uri =404;
    }

    location / {
        proxy_pass http://127.0.0.1:3083;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400;
    }
}
