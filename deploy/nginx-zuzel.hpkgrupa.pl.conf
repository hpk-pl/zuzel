# /etc/nginx/sites-available/zuzel.hpkgrupa.pl
# Instalacja:
#   sudo cp deploy/nginx-zuzel.hpkgrupa.pl.conf /etc/nginx/sites-available/zuzel.hpkgrupa.pl
#   sudo ln -sf /etc/nginx/sites-available/zuzel.hpkgrupa.pl /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d zuzel.hpkgrupa.pl

server {
    listen 80;
    listen [::]:80;
    server_name zuzel.hpkgrupa.pl;

    location / {
        proxy_pass http://127.0.0.1:3080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400;
    }
}
